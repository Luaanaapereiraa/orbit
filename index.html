<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Timer pomodoro para ajudar devs a manter o foco." />
  <meta name="theme-color" content="#09090b" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap"
    rel="stylesheet" />
  <title>Pomodoro Dev</title>
  <script>
    try {
      var raw = localStorage.getItem('@pomodorodev:cycles-state-2.0.0')
      var theme = raw ? JSON.parse(raw).settings.theme : 'dark'
      document.documentElement.classList.toggle('dark', theme !== 'light')
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
